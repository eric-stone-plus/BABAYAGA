[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "babayaga-engine"
version = "0.0.1"
description = "Authorized-only credential-attack engine (ROE-gated engagement mode)"
requires-python = ">=3.11"
# PHASE CONSTRAINT (RESEARCH.md): stdlib-only on purpose — protocol
# libraries are license traps (impacket Apache-1.1-modified, paramiko LGPL,
# asyncssh EPL). Do not add dependencies without a recorded license verdict.
dependencies = []

[project.scripts]
babayaga = "babayaga.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["babayaga"]

[tool.pytest.ini_options]  # not used at v0 (stdlib unittest); kept for orientation
testpaths = ["tests"]
