<?xml version="1.0" encoding="UTF-8"?>
<!--
  BABAYAGA logo — master artwork (hand-authored, pure vector, no fonts).
  Motifs: gold-foil tarot frame (the Continental / Baba Yaga myth),
  diagonal gold pencil (John Wick's legendary improvised weapon —
  discipline, not brute force), spaced roman capitals as geometry.
  Palette: matte black #0d0d0f, antique gold #c9a227 (+ shades), bone #e6dfc9.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <g id="diamond">
      <polygon points="0,-9 9,0 0,9 -9,0" fill="#c9a227"/>
    </g>

    <!-- Roman capitals, constructed. Local box: cap height 100, baseline y=100. -->
    <g id="cap-A">
      <path d="M6 100 L33 2"  stroke="#c9a227" stroke-width="9"  fill="none"/>
      <path d="M40 2 L68 100" stroke="#c9a227" stroke-width="13" fill="none"/>
      <path d="M16 61 H58"     stroke="#c9a227" stroke-width="7"  fill="none"/>
      <rect x="0"  y="93" width="13" height="7" fill="#c9a227"/>
      <rect x="61" y="93" width="15" height="7" fill="#c9a227"/>
    </g>
    <g id="cap-B">
      <rect x="8" y="0" width="12" height="100" fill="#c9a227"/>
      <rect x="2" y="0"  width="24" height="7" fill="#c9a227"/>
      <rect x="2" y="93" width="24" height="7" fill="#c9a227"/>
      <path d="M20 7  H36 A20 20 0 0 1 36 47 H20" stroke="#c9a227" stroke-width="9" fill="none"/>
      <path d="M20 53 H38 A22 22 0 0 1 38 95 H20" stroke="#c9a227" stroke-width="9" fill="none"/>
    </g>
    <g id="cap-G">
      <path d="M64 14 A42 42 0 1 0 64 86" stroke="#c9a227" stroke-width="10" fill="none"/>
      <rect x="36" y="52" width="30" height="8" fill="#c9a227"/>
      <rect x="56" y="52" width="10" height="40" fill="#c9a227"/>
    </g>
    <g id="cap-Y">
      <path d="M4 0 L33 46"  stroke="#c9a227" stroke-width="9"  fill="none"/>
      <path d="M68 0 L37 50" stroke="#c9a227" stroke-width="13" fill="none"/>
      <path d="M35 48 V100"  stroke="#c9a227" stroke-width="13" fill="none"/>
      <rect x="-2" y="0"  width="12" height="7" fill="#c9a227"/>
      <rect x="60" y="0"  width="14" height="7" fill="#c9a227"/>
      <rect x="27" y="93" width="16" height="7" fill="#c9a227"/>
    </g>
  </defs>

  <!-- matte black ground -->
  <rect x="0" y="0" width="1000" height="1250" fill="#0d0d0f"/>

  <!-- gold-foil tarot frame -->
  <rect x="40" y="40" width="920" height="1170" rx="8" fill="none" stroke="#c9a227" stroke-width="5"/>
  <rect x="62" y="62" width="876" height="1126" rx="5" fill="none" stroke="#c9a227" stroke-width="1.6"/>
  <use href="#diamond" x="51"  y="51"/>
  <use href="#diamond" x="949" y="51"/>
  <use href="#diamond" x="51"  y="1199"/>
  <use href="#diamond" x="949" y="1199"/>

  <!-- top ornament -->
  <use href="#diamond" transform="translate(500,150) scale(1.45)"/>

  <!-- Continental-coin ring -->
  <circle cx="500" cy="548" r="222" fill="none" stroke="#c9a227" stroke-width="7"/>
  <circle cx="500" cy="548" r="205" fill="none" stroke="#c9a227" stroke-width="1.6"/>

  <!-- the pencil: diagonal, gold, tip to lower-left -->
  <g transform="translate(500,548) rotate(-45) scale(1.08)">
    <!-- body facets (hex shading) -->
    <rect x="-124" y="-14" width="254" height="9" fill="#d4af37"/>
    <rect x="-124" y="-5" width="254" height="10" fill="#c9a227"/>
    <rect x="-124" y="5" width="254" height="9" fill="#96771c"/>
    <!-- sharpened wood cone: the single bone-white accent -->
    <polygon points="-124,-14 -158,0 -124,14" fill="#e6dfc9"/>
    <!-- graphite point -->
    <polygon points="-157,-6 -174,0 -157,6" fill="#2a2a2e"/>
    <!-- ferrule -->
    <rect x="130" y="-13" width="18" height="26" fill="#8a6d1a"/>
    <line x1="136" y1="-13" x2="136" y2="13" stroke="#5c4910" stroke-width="2"/>
    <line x1="142" y1="-13" x2="142" y2="13" stroke="#5c4910" stroke-width="2"/>
    <!-- black end cap -->
    <rect x="148" y="-11" width="18" height="22" rx="4" fill="#16161a"/>
  </g>

  <!-- title divider -->
  <line x1="230" y1="952" x2="478" y2="952" stroke="#c9a227" stroke-width="1.6"/>
  <line x1="522" y1="952" x2="770" y2="952" stroke="#c9a227" stroke-width="1.6"/>
  <use href="#diamond" transform="translate(500,952) scale(1.1)"/>

  <!-- BABAYAGA in spaced roman capitals (advance 70/76/72 + 14 tracking) -->
  <g transform="translate(224,1000) scale(0.8)">
    <use href="#cap-B" x="0"/>
    <use href="#cap-A" x="84"/>
    <use href="#cap-B" x="174"/>
    <use href="#cap-A" x="258"/>
    <use href="#cap-Y" x="348"/>
    <use href="#cap-A" x="434"/>
    <use href="#cap-G" x="524"/>
    <use href="#cap-A" x="614"/>
  </g>
</svg>
